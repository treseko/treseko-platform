[pytest]
asyncio_mode = auto
addopts = --strict-markers
testpaths = .
python_files = test_*.py
norecursedirs = app live_checks scripts .venv __pycache__
markers =
    unit: pruebas deterministas aisladas de servicios vivos
    integration: requiere servicios aislados preparados por la suite
    live: opera explícitamente contra una instalación iniciada; nunca se recolecta automáticamente
