limit_req_zone $binary_remote_addr zone=treseko_update_check:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=treseko_update_status:10m rate=12r/m;

# Read-only progress remains available during maintenance. Re-evaluate after
# the internal error-page redirect (POST is converted to GET by error_page).
map "$request_method:$uri" $treseko_update_read_allowed {
  volatile;
  default 0;
  ~^(GET|HEAD):/api/system/updates/status(/[^/]+)?$ 1;
  ~^(GET|HEAD):/(maintenance\.html|version\.json|gecko-community-icon\.svg)$ 1;
}

map "$request_method:$uri" $treseko_update_callback_route {
  default 0;
  "~^POST:/api/(automation-jobs/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/result|ai-engine/executions/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/result)$" 1;
}

server {
  listen 80;
  server_name _;

  # Docker puede cambiar la IP de `backend` al recrear contenedores. Resolver
  # mediante el DNS embebido evita que Nginx conserve una IP obsoleta.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $treseko_backend http://backend:8000;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 100m;

  error_page 503 =503 /maintenance.html;

  # Check before location routing so API, direct index/assets and new WebSocket
  # handshakes cannot bypass maintenance. Existing connections must still drain.
  set $treseko_update_blocked 0;
  set $treseko_update_maintenance 0;
  set $treseko_update_draining 0;
  set $treseko_update_hard_fenced 0;
  set $treseko_update_callback_allowed 0;
  if (-f /usr/share/nginx/html/.maintenance) {
    set $treseko_update_blocked 1;
    set $treseko_update_maintenance 1;
  }
  if (-f /usr/share/nginx/html/.treseko-update-fence) {
    set $treseko_update_blocked 1;
    set $treseko_update_hard_fenced 1;
  }
  if (-f /usr/share/nginx/html/.treseko-update-draining) {
    set $treseko_update_blocked 1;
    set $treseko_update_draining 1;
  }
  if ($treseko_update_read_allowed) {
    set $treseko_update_blocked 0;
  }
  if ($treseko_update_callback_route = 1) {
    set $treseko_update_callback_allowed 1;
  }
  if ($treseko_update_draining = 0) {
    set $treseko_update_callback_allowed 0;
  }
  if ($treseko_update_hard_fenced = 1) {
    set $treseko_update_callback_allowed 0;
  }
  if ($treseko_update_maintenance = 1) {
    set $treseko_update_callback_allowed 0;
  }
  if ($treseko_update_callback_allowed = 1) {
    set $treseko_update_blocked 0;
  }
  if ($treseko_update_blocked = 1) {
    return 503;
  }

  location = /__treseko_update_gate_probe__ {
    access_log off;
    return 204;
  }

  location = /api/system/updates/check-community {
    limit_req zone=treseko_update_check burst=2 nodelay;
    limit_req_status 429;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $treseko_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/system/updates/status(/.*)?$ {
    limit_req zone=treseko_update_status burst=2 nodelay;
    limit_req_status 429;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $treseko_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $treseko_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    proxy_pass $treseko_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(informes|informes-internos|static)/ {
    proxy_pass $treseko_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # La pagina estatica de mantenimiento se sirve durante un 503. Este logo se
  # excluye de esa redireccion para conservar la identidad visual mientras la
  # aplicacion reemplaza el bundle.
  location = /gecko-community-icon.svg {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }

  location = /maintenance.html {
    root /usr/share/nginx/html;
    add_header Retry-After 30 always;
    add_header Cache-Control "no-store" always;
    try_files /maintenance.html =503;
  }
}
