name: Build GUI installer

on:
  workflow_dispatch:
  push:
    paths:
      - "VERSION"
      - "installer/**"
      - "scripts/install_local_treseko.*"

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: py -m pip install -r installer/requirements-build.txt
      - name: Build and validate Windows installer
        run: py installer/build_installer.py --target windows
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $artifact = "dist/Treseko-Installer-v$version-windows-x64.exe"
          if (-not (Test-Path $artifact)) { throw "Missing artifact: $artifact" }
          $bytes = [System.IO.File]::ReadAllBytes($artifact)
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Invalid PE artifact: $artifact" }
      - uses: actions/upload-artifact@v4
        with:
          name: treseko-installer-windows-${{ github.sha }}
          path: dist/Treseko-Installer-v*-windows-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r installer/requirements-build.txt
      - name: Install appimagetool
        shell: bash
        run: |
          curl --fail --location --output appimagetool-x86_64.AppImage \
            https://github.com/AppImageCommunity/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Build and validate Linux installer
        run: APPIMAGETOOL="$PWD/appimagetool-x86_64.AppImage" APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 python installer/build_installer.py --target linux
      - name: Verify Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          artifact="dist/Treseko-Installer-v${version}-linux-x64.AppImage"
          test -s "$artifact"
          test -x "$artifact"
          test "$(dd if="$artifact" bs=1 count=4 2>/dev/null)" = $'\177ELF'
      - uses: actions/upload-artifact@v4
        with:
          name: treseko-installer-linux-${{ github.sha }}
          path: dist/Treseko-Installer-v*-linux-x64.AppImage
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r installer/requirements-build.txt
      - name: Build and validate native macOS app
        run: python installer/build_installer.py --target macos
      - name: Verify architecture-specific artifact name
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          artifact="dist/Treseko-Installer-v${version}-macos-${{ matrix.arch }}.app"
          test -d "$artifact"
          test -x "$artifact/Contents/MacOS/Treseko-Installer"
          test -s "$artifact/Contents/Info.plist"
          test -s "$artifact/Contents/Resources/treseko-installer.icns"
      - uses: actions/upload-artifact@v4
        with:
          name: treseko-installer-macos-${{ matrix.arch }}-${{ github.sha }}
          path: dist/Treseko-Installer-v*-macos-${{ matrix.arch }}.app
          if-no-files-found: error
