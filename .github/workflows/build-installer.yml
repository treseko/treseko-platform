name: Build GUI installer

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    paths:
      - "VERSION"
      - "installer/**"
      - "scripts/install_local_treseko.*"

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r installer/requirements-build.txt
      - name: Build and validate Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          python -c "import PIL; print('Pillow', PIL.__version__)"
          python -m PyInstaller --version
          python -u installer/build_installer.py --target windows 2>&1 | Tee-Object windows-build.log
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed with exit code $LASTEXITCODE" }
      - name: Smoke-test Qt interface without Tkinter
        shell: pwsh
        run: |
          $artifact = "dist/Treseko-Windows-x64.exe"
          $env:QT_QPA_PLATFORM = 'offscreen'
          & $artifact --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Qt GUI smoke test failed with exit code $LASTEXITCODE" }
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $artifact = "dist/Treseko-Windows-x64.exe"
          if (-not (Test-Path $artifact)) { throw "Missing artifact: $artifact" }
          $bytes = [System.IO.File]::ReadAllBytes($artifact)
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Invalid PE artifact: $artifact" }
      - uses: actions/upload-artifact@v4
        with:
          name: treseko-installer-windows-${{ github.sha }}
          path: dist/Treseko-Windows-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r installer/requirements-build.txt
      - name: Install Qt platform runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 libxcb-glx0 libxcb-util1 libxcb-keysyms1 libxcb-cursor0 libxcb-randr0 libxcb-sync1 libxcb-shape0 libxcb-image0 libxcb-xfixes0 libxcb-shm0 libxcb-render-util0 libxcb-render0 libxcb-icccm4
      - name: Install appimagetool
        shell: bash
        run: |
          curl --fail --location --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Build and validate Linux installer
        run: APPIMAGETOOL="$PWD/appimagetool-x86_64.AppImage" APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 python installer/build_installer.py --target linux
      - name: Verify Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="dist/Treseko-Linux-x64.AppImage"
          test -s "$artifact"
          test -x "$artifact"
          test "$(dd if="$artifact" bs=1 count=4 2>/dev/null)" = $'\177ELF'
      - name: Smoke-test Qt interface without Tkinter
        shell: bash
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=offscreen dist/Treseko-Linux-x64.AppImage --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: treseko-installer-linux-${{ github.sha }}
          path: dist/Treseko-Linux-x64.AppImage
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r installer/requirements-build.txt
      - name: Build and validate native macOS app
        run: python -u installer/build_installer.py --target macos
      - name: Verify architecture-specific artifact name
        shell: bash
        run: |
          set -euo pipefail
          artifact="dist/Treseko-macOS-${{ matrix.arch }}.app"
          test -d "$artifact"
          test -x "$artifact/Contents/MacOS/Treseko-Installer"
          test -s "$artifact/Contents/Info.plist"
          test -s "$artifact/Contents/Resources/treseko-installer.icns"
          ditto -c -k --sequesterRsrc --keepParent "$artifact" "$artifact.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: treseko-installer-macos-${{ matrix.arch }}-${{ github.sha }}
          path: dist/Treseko-macOS-${{ matrix.arch }}.app.zip
          if-no-files-found: error

  attach-release-installers:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: treseko-installer-windows-${{ github.sha }}
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: treseko-installer-linux-${{ github.sha }}
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: treseko-installer-macos-arm64-${{ github.sha }}
          path: release-assets/macos
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-assets/windows/Treseko-Windows-x64.exe
            release-assets/linux/Treseko-Linux-x64.AppImage
            release-assets/macos/Treseko-macOS-arm64.app.zip
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
